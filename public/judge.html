<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Telemark · Judge</title>
<link rel="icon" type="image/png" href="/logo_telemark.png" />
<link rel="apple-touch-icon" href="/logo_telemark.png" />
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #09080d;
    --surface: #13111a;
    --surface-hover: #1c1926;
    --surface-active: #242030;
    --ink: #ece9f0;
    --muted: #8d899a;
    --line: rgba(255, 255, 255, 0.08);
    --accent: #f06a37;
    --accent-glow: rgba(240, 106, 55, 0.15);
    --accent-ink: #fff;
    --ok: #3ec896;
    --ok-bg: rgba(62, 200, 150, 0.1);
    --warn: #f3b73e;
    --warn-bg: rgba(243, 183, 62, 0.1);
    --danger: #ff5252;
    --danger-bg: rgba(255, 82, 82, 0.1);
    --num: 'JetBrains Mono', ui-monospace, monospace;
  }
  .spin {
    animation: spin 1.2s linear infinite;
    display: inline-block;
  }
  #lockedBanner {
    background: rgba(255, 82, 82, 0.15);
    color: #ff5252;
    border-bottom: 1px solid rgba(255, 82, 82, 0.25);
    padding: 12px 20px;
    font-weight: 700;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.02em;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    z-index: 4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.4;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
  }

  .login-box {
    background: rgba(19, 17, 26, 0.6);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: rgba(19, 17, 26, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .badge {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent) 30%, #f18c5e 100%);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 22px;
    flex: 0 0 auto;
    box-shadow: 0 4px 12px var(--accent-glow);
  }
  .htxt { flex: 1; min-width: 0; }
  .htxt h1 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .htxt p { margin: 4px 0 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #444; flex: 0 0 auto; transition: background 0.3s; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  main { flex: 1; padding: 20px 16px 120px; max-width: 560px; margin: 0 auto; width: 100%; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; padding: 15vh 20px; color: var(--muted); }
  .pulse { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pick { display: grid; gap: 12px; margin-top: 8px; }
  .pick button {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 16px;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 600;
  }
  .pick button:hover { background: var(--surface-hover); border-color: rgba(255,255,255,0.15); transform: translateY(-1px); }
  .pick button:active { transform: scale(.98); }
  /* ---- Final round rows (places) ---- */
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 10px;
  }
  .bib { font-family: var(--num); font-weight: 700; font-size: 22px; min-width: 46px; text-align: center; color: var(--accent); }
  .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .places { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .pl {
    font-family: var(--num);
    font-weight: 700;
    min-width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-active);
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pl:hover:not(:disabled) { border-color: rgba(255,255,255,0.2); color: var(--ink); }
  .pl.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

  /* ---- Intermediate round: tile grid ---- */
  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 10px;
    padding: 4px 0 8px;
  }
  .tile {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 18px;
    padding: 16px 8px 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .tile:active { transform: scale(0.95); }
  .tile.on {
    border-color: var(--ok);
    background: var(--ok);
    box-shadow: 0 4px 15px rgba(62, 200, 150, 0.4);
  }
  .tile:disabled { pointer-events: none; opacity: 0.6; }
  .tile-num {
    font-family: var(--num);
    font-size: 30px;
    font-weight: 800;
    color: var(--muted);
    transition: color 0.15s;
    line-height: 1;
  }

  /* ---- Numpad ---- */
  .numpad-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 0;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    font-family: var(--num);
    transition: all 0.15s ease;
  }
  .numpad-btn:active {
    background: var(--surface-active);
    transform: scale(0.95);
  }

  .tile.on .tile-num { color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .tile-dots {
    display: flex;
    gap: 7px;
    align-items: center;
    height: 18px;
  }
  .pdot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--surface-active);
    border: 1.5px solid rgba(255,255,255,0.18);
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    cursor: pointer;
    flex-shrink: 0;
  }
  .pdot.on {
    background: var(--warn);
    border-color: var(--warn);
    box-shadow: 0 0 6px rgba(243,183,62,0.4);
  }
  .heat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 20px 4px 8px; font-weight: 700; }
  footer {
    position: sticky;
    bottom: 0;
    background: rgba(19, 17, 26, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  .cs { font-family: var(--num); font-weight: 700; font-size: 18px; padding: 8px 16px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(243,183,62,0.2); }
  .cs.ok { background: var(--ok-bg); color: var(--ok); border-color: rgba(62,200,150,0.2); }
  .grow { flex: 1; }
  .confirm {
    padding: 14px 28px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px var(--accent-glow);
  }
  .confirm:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(240, 106, 55, 0.25); }
  .confirm:active:not(:disabled) { transform: translateY(0); }
  .confirm:disabled { opacity: .3; cursor: not-allowed; box-shadow: none; }
  .signed { color: var(--ok); font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 17px; }
  #settingsBtn:hover { color: var(--ink) !important; }

  /* ---- JS 3.0 points scoring styles ---- */
  .comp-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .comp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    padding-bottom: 12px;
  }
  .comp-bib {
    font-family: var(--num);
    font-weight: 800;
    font-size: 24px;
    color: var(--accent);
  }
  .comp-name {
    font-size: 16px;
    font-weight: 600;
  }
  .comp-total {
    font-family: var(--num);
    font-weight: 700;
    font-size: 18px;
    color: var(--ok);
    background: var(--ok-bg);
    padding: 4px 10px;
    border-radius: 8px;
  }
  .comp-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .comp-label {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    width: 60px;
  }
  .comp-controls {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .comp-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-active);
    color: var(--ink);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .comp-btn:hover { border-color: rgba(255,255,255,0.2); }
  .comp-btn:active { transform: scale(0.92); }
  .comp-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .comp-val {
    font-family: var(--num);
    font-size: 18px;
    font-weight: 700;
    width: 56px;
    text-align: center;
    color: var(--ink);
  }
  /* Hide language switcher on this page */
  #language-switcher-widget,
  div[style*="position:fixed"][style*="z-index:999999"],
  div[style*="position: fixed"][style*="z-index: 999999"] {
    display: none !important;
  }
</style>
  <script src="/ui.js"></script>
  <script src="/i18n.js"></script>
</head>

<script>
function getUrl(path) {
  let host = localStorage.getItem('telemark_server_url');
  if (!host) {
    host = window.location.origin;
  }
  return host.replace(/\/$/, '') + path;
}

const api = async (p, o, retries = 5, delay = 300) => {
  const spinner = document.getElementById('syncSpinner');
  if (spinner) {
    spinner.style.opacity = '1';
    spinner.classList.add('spin');
  }
  try {
    for (let i = 0; i <= retries; i++) {
      try {
        const res = await fetch(getUrl(p), o);
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch(_) { throw new Error('კავშირის შეცდომა'); }
        
        if (!res.ok) {
          if ((res.status === 503 || res.status === 429) && i < retries) {
            console.warn(`[API] Server busy (${res.status}), retrying ${i+1}/${retries} in ${delay}ms...`);
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2.0;
            continue;
          }
          const err = new Error(data.error || 'კავშირის შეცდომა');
          err.isPermanent = true;
          throw err;
        }
        return data;
      } catch (e) {
        if (e.isPermanent || i === retries) throw e;
        console.warn(`[API] Request failed (${e.message}), retrying ${i+1}/${retries} in ${delay}ms...`);
        await new Promise(resolve => setTimeout(resolve, delay));
        delay *= 2.0;
      }
    }
  } finally {
    if (spinner) {
      setTimeout(() => {
        spinner.style.opacity = '0';
        spinner.classList.remove('spin');
      }, 300);
    }
  }
};
let apiQueue = Promise.resolve();
const POST = (p, b) => {
  const currentPromise = apiQueue.then(() => api(p, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(b || {})
  }));
  apiQueue = currentPromise.catch(() => {});
  return currentPromise;
};
let me=null, view=null, rdid=null, activeRound=null, socket=null, jobsDoneTimeout=null;

function connectWS(){
  let host = localStorage.getItem('telemark_server_url');
  if (!host) {
    host = location.host;
    if (!host || location.protocol === 'file:') {
      host = 'www.telemark.one';
    }
  } else {
    host = host.replace(/^https?:\/\//, '');
  }
  
  const wsProto = host.includes('localhost') || host.includes('192.168.') || host.includes('10.') || host.includes('172.') || host.includes('4000') ? 'ws' : 'wss';
  socket=new WebSocket(wsProto+'://'+host);
  socket.onopen=()=>document.getElementById('conn').classList.add('on');
  socket.onclose=()=>{document.getElementById('conn').classList.remove('on');socket=null;};
  socket.onmessage=(e)=>{
    const {type,payload}=JSON.parse(e.data);
    if(type==='dance:open' || type==='dance:reopened' || type==='judges:updated'){
      if (!me) { pickJudge(); return; }
      pollActiveRound();
    }
  };
}

setInterval(() => {
  if (document.getElementById('conn').classList.contains('on')) return;
  if (me) pollActiveRound();
}, 4000);

function openSettings() {
  let host = localStorage.getItem('telemark_server_url') || '';
  host = host.replace(/^https?:\/\//, '');
  document.getElementById('serverHostInput').value = host;
  document.getElementById('settingsOverlay').style.display = 'flex';
}

function closeSettings() {
  document.getElementById('settingsOverlay').style.display = 'none';
}

function saveSettings() {
  const host = document.getElementById('serverHostInput').value.trim();
  if (host) {
    let url = host;
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      url = (host.includes('localhost') || host.includes('192.168.') || host.includes('10.') || host.includes('172.') || host.includes('4000')) ? 'http://' + host : 'https://' + host;
    }
    localStorage.setItem('telemark_server_url', url);
  } else {
    localStorage.removeItem('telemark_server_url');
  }
  closeSettings();
  location.reload();
}

let diagInterval = null;
async function getBatteryLevel() {
  if (navigator.getBattery) {
    try {
      const b = await navigator.getBattery();
      return Math.round(b.level * 100);
    } catch (_) {}
  }
  return null;
}
async function measurePing() {
  const start = Date.now();
  try {
    await fetch(getUrl('/api/competition'), { method: 'HEAD' });
    return Date.now() - start;
  } catch (_) {
    return 999;
  }
}
async function sendDiagnostics() {
  if (!me || !socket || socket.readyState !== 1) return;
  const battery = await getBatteryLevel();
  const ping = await measurePing();
  socket.send(JSON.stringify({
    type: 'judge:diagnostics',
    payload: { officialId: me.id, battery, ping }
  }));
}
function startDiagnosticsHeartbeat() {
  if (diagInterval) clearInterval(diagInterval);
  sendDiagnostics();
  diagInterval = setInterval(sendDiagnostics, 10000);
}

function setJudge(j) {
  me = j;
  localStorage.setItem('telemark_judge_id', j.id);
  document.getElementById('badge').textContent = j.judge_letter || '?';
  document.getElementById('sub').textContent = j.full_name + ' · Judge ' + (j.judge_letter || '');
  startPolling();
  startDiagnosticsHeartbeat();
}

let pollInterval = null;
function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollActiveRound();
  pollInterval = setInterval(pollActiveRound, 3000);
}

async function pollActiveRound() {
  if (!me) return;
  try {
    const active = await api('/api/judge/' + me.id + '/active-round');
    
    // Toggle locked banner
    const banner = document.getElementById('lockedBanner');
    if (banner) {
      banner.style.display = active.locked ? 'flex' : 'none';
    }
    
    if (active.notAssigned) {
      if (jobsDoneTimeout) {
        clearTimeout(jobsDoneTimeout);
        jobsDoneTimeout = null;
      }
      document.getElementById('footer').style.display = 'none';
      document.getElementById('main').innerHTML =
        '<div class="center"><div style="font-size:14px;color:var(--warn);background:var(--warn-bg);border:1px solid rgba(243,183,62,0.2);padding:16px 24px;border-radius:16px;max-width:320px;font-weight:600">' + t('not_assigned_round_msg') + '</div></div>';
      activeRound = null;
      rdid = null;
      return;
    }
    
    if (!active.activeRoundId) {
      if (jobsDoneTimeout) {
        clearTimeout(jobsDoneTimeout);
        jobsDoneTimeout = null;
      }
      document.getElementById('footer').style.display = 'none';
      document.getElementById('main').innerHTML =
        '<div class="center"><div class="pulse"></div><div>' + t('waiting_scrutineer_msg') + '</div></div>';
      activeRound = null;
      rdid = null;
      return;
    }
    
    activeRound = active;
    
    if (rdid === null) {
      renderRoundDashboard(activeRound);
    } else {
      const belongs = activeRound.dances.some(d => d.id === rdid);
      if (!belongs) {
        rdid = null;
        renderRoundDashboard(activeRound);
      }
    }
  } catch (e) {
    console.error('Polling active round failed:', e);
  }
}

function renderRoundDashboard(round) {
  let kindText = round.kind || '';
  kindText = kindText.replace(/\bfinal\b/gi, 'Final');
  document.getElementById('sub').textContent = round.categoryName + ' · ' + kindText + ' · ' + me.full_name + ' · Judge ' + (me.judge_letter || '');
  document.getElementById('footer').style.display = 'none';
  const main = document.getElementById('main');
  
  // Find next pending dance
  let nextDanceHtml = '';
  const pendingDance = round.dances.find(d => !d.confirmed || (round.isFinal && !d.signed));
  if (pendingDance) {
    if (jobsDoneTimeout) {
      clearTimeout(jobsDoneTimeout);
      jobsDoneTimeout = null;
    }
    const nextDanceName = danceName(pendingDance.dance_code);
    nextDanceHtml = `<div style="margin-top:4px; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; background: var(--warn-bg); border: 1px solid rgba(243, 183, 62, 0.2); border-left: 4px solid var(--warn); color: var(--warn); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px;">
      <span>${t('next_dance_lbl')}${nextDanceName}</span>
    </div>`;
  } else {
    nextDanceHtml = `<div style="margin-top:4px; margin-bottom: 16px; padding: 16px; border-radius: 12px; background: var(--ok-bg); border: 1px solid rgba(0, 230, 118, 0.25); border-left: 4px solid var(--ok); color: var(--ok); font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <span data-i18n="job_done">${t('job_done')}</span>
    </div>`;
    if (!jobsDoneTimeout) {
      jobsDoneTimeout = setTimeout(() => {
        jobsDoneTimeout = null;
        logout();
      }, 4500);
    }
  }

  main.innerHTML = nextDanceHtml + 
    `<h3 style="margin-top:10px;margin-bottom:15px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">${t('select_dance_to_judge')}</h3>` +
    '<div class="pick" id="dancesList"></div>';
  
  const list = document.getElementById('dancesList');
  round.dances.forEach(d => {
    const b = document.createElement('button');
    b.style.display = 'flex';
    b.style.justifyContent = 'space-between';
    b.style.alignItems = 'center';
    
    if (d.confirmed) {
      b.style.borderColor = 'var(--ok)';
      b.style.background = 'var(--ok-bg)';
      b.innerHTML = `<span class="badge" style="background:var(--ok)">✓</span>` +
        `<span style="flex:1;margin-left:12px;font-weight:600;color:var(--ok)">${danceName(d.dance_code)}</span>` +
        `<span style="font-size:13px;color:var(--ok)">${t('confirmed_status')}</span>`;
    } else {
      b.innerHTML = `<span class="badge" style="background:var(--accent)">▷</span>` +
        `<span style="flex:1;margin-left:12px;font-weight:600">${danceName(d.dance_code)}</span>` +
        `<span style="font-size:13px;color:var(--muted)">${t('pending_status')}</span>`;
    }
    
    b.onclick = () => {
      rdid = d.id;
      loadDance();
    };
    list.appendChild(b);
  });
}

function addPinDigit(n) {
  const inp = document.getElementById('pinInput');
  if (inp.value.length < 4) inp.value += n;
  if (inp.value.length === 4) submitPin();
}
function delPinDigit() {
  const inp = document.getElementById('pinInput');
  inp.value = inp.value.slice(0, -1);
}
function clearPin() {
  document.getElementById('pinInput').value = '';
}

async function submitPin(){
  const inp=document.getElementById('pinInput');
  const btn=document.getElementById('pinSubmit');
  const err=document.getElementById('pinError');
  const pin=inp.value.trim();
  if(pin.length !== 4 || !/^\d{4}$/.test(pin)){
    err.textContent=t('pin_four_digits_err');
    inp.style.borderColor='#ff7070';
    return;
  }
  btn.disabled=true; btn.textContent='...';
  err.textContent='';
  try{
    const res=await fetch(getUrl('/api/judges/login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'error_invalid_pin');
    setJudge(data);
    document.getElementById('headerBar').style.display='flex'; // Show header again
  }catch(e){
    err.textContent=t(e.message);
    err.style.display='block';
    inp.style.borderColor='var(--danger)';
    inp.value='';
  }finally{
    btn.disabled=false; btn.textContent='Login';
  }
}

async function loadDance(){
  if(!me||!rdid) return;
  try {
    view=await api('/api/judge/'+me.id+'/dance/'+rdid);
    render();
  } catch(e) {
    alert(e.message || 'Error loading dance');
  }
}

function render(){
  let kindText = view.kind || '';
  kindText = kindText.replace(/\bfinal\b/gi, 'Final');
  document.getElementById('sub').textContent = kindText + ' · ' + danceName(view.dance) + ' · ' + me.full_name + ' · Judge ' + (me.judge_letter || '');
  const main=document.getElementById('main'); main.innerHTML='';

  const backBtn = document.createElement('button');
  backBtn.style.cssText='width:100%;margin-bottom:15px;height:40px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);cursor:pointer;font-weight:600;font-size:14px;font-family:inherit';
  backBtn.textContent = t('back_to_dances_btn');
  backBtn.onclick = () => { rdid = null; pollActiveRound(); };
  main.appendChild(backBtn);

  const flat=Object.entries(view.heats).sort((a,b)=>a[0]-b[0]);

  if (!view.isFinal) {
    // Intermediate: one big tile grid across all heats
    if(flat.length>1) {
      // Show heat labels above each group but still use a single grid flow
      flat.forEach(([h,couples])=>{
        const l=document.createElement('div'); l.className='heat-label'; l.textContent='Heat '+h; main.appendChild(l);
        const grid=document.createElement('div'); grid.className='tile-grid';
        couples.forEach(c=>grid.appendChild(interTile(c)));
        main.appendChild(grid);
      });
    } else {
      const grid=document.createElement('div'); grid.className='tile-grid';
      flat.forEach(([h,couples])=>couples.forEach(c=>grid.appendChild(interTile(c))));
      main.appendChild(grid);
    }
  } else {
    // Final: traditional rows with place buttons OR component card for JS 3.0
    if (view.judgingSystem === 'js3.0') {
      flat.forEach(([h,couples])=>{
        if(flat.length>1){const l=document.createElement('div');l.className='heat-label';l.textContent='Heat '+h;main.appendChild(l);}
        couples.forEach(c=>main.appendChild(componentCard(c)));
      });
    } else {
      flat.forEach(([h,couples])=>{
        if(flat.length>1){const l=document.createElement('div');l.className='heat-label';l.textContent='Heat '+h;main.appendChild(l);}
        couples.forEach(c=>main.appendChild(finalRow(c)));
      });
    }
  }

  document.getElementById('footer').style.display='flex';
  updateChecksum();
}

function updateUI() {
  if (!view) return;
  const flat = Object.values(view.heats).flat();
  flat.forEach(c => {
    if (!view.isFinal) {
      // Intermediate round tile updates
      const tile = document.querySelector(`.tile[data-entry-id="${c.entry_id}"]`);
      if (tile) {
        tile.className = 'tile' + (c.cross ? ' on' : '');
        // Update dots
        for (let i = 1; i <= 2; i++) {
          const dot = tile.querySelector(`.pdot[data-dot-index="${i}"]`);
          if (dot) {
            dot.className = 'pdot' + (c.help >= i ? ' on' : '');
          }
        }
      }
    } else {
      if (view.judgingSystem === 'js3.0') {
        const card = document.querySelector(`.comp-card[data-entry-id="${c.entry_id}"]`);
        if (card) {
          const hasScores = c.score_tq != null && c.score_mm != null && c.score_ps != null && c.score_cp != null;
          const sum = hasScores ? (c.score_tq + c.score_mm + c.score_ps + c.score_cp) : 0;
          card.querySelector('.comp-total').textContent = hasScores ? sum.toFixed(2) : '—';
          
          const tqVal = card.querySelector(`.comp-val[data-key="tq"]`);
          if (tqVal) tqVal.textContent = c.score_tq != null ? c.score_tq.toFixed(2) : '—';
          
          const mmVal = card.querySelector(`.comp-val[data-key="mm"]`);
          if (mmVal) mmVal.textContent = c.score_mm != null ? c.score_mm.toFixed(2) : '—';
          
          const psVal = card.querySelector(`.comp-val[data-key="ps"]`);
          if (psVal) psVal.textContent = c.score_ps != null ? c.score_ps.toFixed(2) : '—';
          
          const cpVal = card.querySelector(`.comp-val[data-key="cp"]`);
          if (cpVal) cpVal.textContent = c.score_cp != null ? c.score_cp.toFixed(2) : '—';
        }
      } else {
        // Final round place button updates
        const row = document.querySelector(`.row[data-entry-id="${c.entry_id}"]`);
        if (row) {
          for (let p = 1; p <= view.numCouples; p++) {
            const b = row.querySelector(`button[data-place="${p}"]`);
            if (b) {
              b.className = 'pl' + (c.place === p ? ' on' : '');
            }
          }
        }
      }
    }
  });
  updateChecksum();
}

function finalRow(c){
  const row=el('div','row');
  row.setAttribute('data-entry-id', c.entry_id);
  row.innerHTML='<span class="bib">'+c.number+'</span><span class="nm"></span>';
  const wrap=el('div','places');
  for(let p=1;p<=view.numCouples;p++){
    const b=el('button','pl'+(c.place===p?' on':''));b.textContent=p;
    b.setAttribute('data-place', p);
    b.disabled=view.confirmed;
    b.onclick=async()=>{ 
      if (c.place === p) return;
      
      const oldPlace = c.place;
      const flat = Object.values(view.heats).flat();
      const conflict = flat.find(x => x.place === p);
      const oldConflictPlace = conflict ? conflict.place : null;
      if (conflict) {
        conflict.place = null;
      }
      c.place = p;
      updateUI();
      
      try {
        const r = await POST('/api/judge/'+me.id+'/dance/'+rdid+'/place',{entryId:c.entry_id,place:p});
        if (r && !r.ok) {
          c.place = oldPlace;
          if (conflict) conflict.place = oldConflictPlace;
          flash(r.error || 'შეცდომა');
          updateUI();
        }
      } catch(err) {
        c.place = oldPlace;
        if (conflict) conflict.place = oldConflictPlace;
        flash('კავშირის შეცდომა');
        updateUI();
      }
    };
    wrap.appendChild(b);
  }
  row.appendChild(wrap); return row;
}

function interTile(c) {
  const tile = document.createElement('div');
  tile.className = 'tile' + (c.cross ? ' on' : '');
  tile.setAttribute('data-entry-id', c.entry_id);
  if (view.confirmed) tile.style.pointerEvents = 'none';

  // Number
  const num = document.createElement('div');
  num.className = 'tile-num';
  num.textContent = c.number;
  tile.appendChild(num);

  // Priority dots
  const dotsWrap = document.createElement('div');
  dotsWrap.className = 'tile-dots';

  for (let i = 1; i <= 2; i++) {
    const dot = document.createElement('div');
    dot.className = 'pdot' + (c.help >= i ? ' on' : '');
    dot.setAttribute('data-dot-index', i);
    dot.onclick = async (e) => {
      e.stopPropagation();
      if (view.confirmed) return;
      
      const nextVal = c.help >= i ? i - 1 : i;
      const oldVal = c.help;
      
      c.help = nextVal;
      updateUI();
      
      try {
        const r = await POST('/api/judge/'+me.id+'/dance/'+rdid+'/help', {entryId: c.entry_id, value: nextVal});
        if (r && !r.ok) {
          c.help = oldVal;
          flash(r.error || 'შეცდომა');
          updateUI();
        }
      } catch (err) {
        c.help = oldVal;
        flash('კავშირის შეცდომა');
        updateUI();
      }
    };
    dotsWrap.appendChild(dot);
  }
  tile.appendChild(dotsWrap);

  // Click tile = toggle cross
  tile.onclick = async () => {
    if (view.confirmed) return;
    
    const oldCross = c.cross;
    c.cross = !c.cross;
    updateUI();
    
    try {
      const r = await POST('/api/judge/'+me.id+'/dance/'+rdid+'/cross', {entryId: c.entry_id, value: c.cross});
      if (r && !r.ok) {
        c.cross = oldCross;
        if (r.reason === 'limit') {
          flash('Only '+view.target+' recalls allowed');
        } else {
          flash(r.error || 'შეცდომა');
        }
        updateUI();
      }
    } catch (err) {
      c.cross = oldCross;
      flash('კავშირის შეცდომა');
      updateUI();
    }
  };

  return tile;
}


function componentCard(c) {
  const card = el('div', 'comp-card');
  card.setAttribute('data-entry-id', c.entry_id);
  
  const hasScores = c.score_tq != null && c.score_mm != null && c.score_ps != null && c.score_cp != null;
  const tq = c.score_tq ?? 7.00;
  const mm = c.score_mm ?? 7.00;
  const ps = c.score_ps ?? 7.00;
  const cp = c.score_cp ?? 7.00;
  
  const sum = hasScores ? (c.score_tq + c.score_mm + c.score_ps + c.score_cp) : 0;
  
  const header = el('div', 'comp-header');
  header.innerHTML = `<span class="comp-bib">${c.number}</span><span class="nm" style="margin-left:12px;font-size:16px"></span>` +
    `<span class="comp-total">${hasScores ? sum.toFixed(2) : '—'}</span>`;
  card.appendChild(header);
  
  const components = [
    { key: 'tq', name: 'TQ (Technical Quality)', val: c.score_tq },
    { key: 'mm', name: 'MM (Movement to Music)', val: c.score_mm },
    { key: 'ps', name: 'PS (Partnering Skills)', val: c.score_ps },
    { key: 'cp', name: 'CP (Choreography)', val: c.score_cp }
  ];
  
  components.forEach(comp => {
    const row = el('div', 'comp-row');
    row.innerHTML = `<span class="comp-label" title="${comp.name}">${comp.key.toUpperCase()}</span>`;
    
    const ctrl = el('div', 'comp-controls');
    const btnMinus = el('button', 'comp-btn');
    btnMinus.textContent = '–';
    btnMinus.disabled = view.confirmed;
    
    const valSpan = el('span', 'comp-val');
    valSpan.setAttribute('data-key', comp.key);
    valSpan.textContent = comp.val != null ? comp.val.toFixed(2) : '—';
    
    const btnPlus = el('button', 'comp-btn');
    btnPlus.textContent = '+';
    btnPlus.disabled = view.confirmed;
    
    btnMinus.onclick = () => adjustComponent(c, comp.key, -0.25);
    btnPlus.onclick = () => adjustComponent(c, comp.key, 0.25);
    
    ctrl.appendChild(btnMinus);
    ctrl.appendChild(valSpan);
    ctrl.appendChild(btnPlus);
    row.appendChild(ctrl);
    card.appendChild(row);
  });
  
  return card;
}

async function adjustComponent(c, key, delta) {
  const oldTq = c.score_tq;
  const oldMm = c.score_mm;
  const oldPs = c.score_ps;
  const oldCp = c.score_cp;
  
  let tq = c.score_tq ?? 7.00;
  let mm = c.score_mm ?? 7.00;
  let ps = c.score_ps ?? 7.00;
  let cp = c.score_cp ?? 7.00;
  
  if (key === 'tq') tq = Math.max(5.00, Math.min(10.00, tq + delta));
  if (key === 'mm') mm = Math.max(5.00, Math.min(10.00, mm + delta));
  if (key === 'ps') ps = Math.max(5.00, Math.min(10.00, ps + delta));
  if (key === 'cp') cp = Math.max(5.00, Math.min(10.00, cp + delta));
  
  c.score_tq = tq;
  c.score_mm = mm;
  c.score_ps = ps;
  c.score_cp = cp;
  updateUI();
  
  try {
    const r = await POST('/api/judge/' + me.id + '/dance/' + rdid + '/components', {
      entryId: c.entry_id,
      tq, mm, ps, cp
    });
    if (r && !r.ok) {
      c.score_tq = oldTq;
      c.score_mm = oldMm;
      c.score_ps = oldPs;
      c.score_cp = oldCp;
      flash(r.error || 'შეცდომა');
      updateUI();
    }
  } catch (err) {
    c.score_tq = oldTq;
    c.score_mm = oldMm;
    c.score_ps = oldPs;
    c.score_cp = oldCp;
    flash('კავშირის შეცდომა');
    updateUI();
  }
}

function updateChecksum(){
  const flat=Object.values(view.heats).flat();
  const cs=document.getElementById('cs'); const btn=document.getElementById('confirm');
  if (!btn) return;
  let valid,label;
  if(view.judgingSystem === 'js3.0'){
    const scoredCouples = flat.filter(c => c.score_tq != null && c.score_mm != null && c.score_ps != null && c.score_cp != null);
    const sum = scoredCouples.reduce((a, b) => a + (b.score_tq + b.score_mm + b.score_ps + b.score_cp), 0);
    valid = scoredCouples.length === view.numCouples;
    label = scoredCouples.length + '/' + view.numCouples;
  }else if(view.isFinal){
    const places=flat.map(c=>c.place).filter(p=>p!=null);
    const sum=places.reduce((a,b)=>a+b,0), exp=view.numCouples*(view.numCouples+1)/2;
    valid=places.length===view.numCouples && new Set(places).size===places.length && sum===exp;
    label=places.length+'/'+view.numCouples;
  }else{
    const x=flat.filter(c=>c.cross).length; valid=x===view.target; label=x+'/'+view.target;
  }
  cs.textContent=label; cs.classList.toggle('ok',valid);

  // Toggle Edit Marks button
  const editBtn = document.getElementById('editMarksBtn');
  if (editBtn) {
    if (view.confirmed && !view.signed && !activeRound?.locked) {
      editBtn.style.display = 'inline-block';
      editBtn.onclick = unconfirmDance;
      editBtn.textContent = t('edit_marks_btn');
    } else {
      editBtn.style.display = 'none';
      editBtn.onclick = null;
    }
  }

  if(view.confirmed){ 
    btn.disabled=true; btn.textContent='✓ ' + t('confirmed_status');
    if(view.signed){ 
      btn.textContent='✓ ' + t('signed_status'); btn.disabled=true;
      btn.style.background='var(--ok)'; btn.style.boxShadow='0 4px 12px rgba(62,200,150,0.25)';
      btn.onclick=null;
    } else { 
      btn.disabled=false; btn.textContent=t('sign_btn'); btn.onclick=openSignModal;
    }
  } else { btn.disabled=!valid; btn.textContent=t('confirm'); btn.onclick=confirmDance; }
}

async function confirmDance(){
  try {
    const r = await POST('/api/judge/'+me.id+'/dance/'+rdid+'/confirm');
    if(!r || !r.ok){ flash('Checksum invalid'); return; }
    loadDance();
  } catch(err) {
    flash('კავშირის შეცდომა');
  }
}

async function unconfirmDance() {
  if (!me || !rdid) return;
  const msg = currentLang === 'ka' 
    ? 'ნამდვილად გსურთ შეფასებების ჩასწორება?' 
    : (currentLang === 'ru' ? 'Вы уверены, что хотите изменить оценки?' : 'Are you sure you want to edit marks?');
    
  if (!confirm(msg)) return;
  
  try {
    const r = await POST('/api/judge/' + me.id + '/dance/' + rdid + '/unconfirm');
    if (r && r.ok) {
      loadDance();
    } else {
      flash(r.error || 'შეცდომა');
    }
  } catch (err) {
    flash('კავშირის შეცდომა');
  }
}

async function sign(){
  openSignModal();
}

/* ---- Signature Pad ---- */
let sigDrawing = false;
let sigHasStrokes = false;
let sigCtx = null;

function openSignModal() {
  const modal = document.getElementById('signModal');
  modal.style.display = 'flex';
  // Init canvas
  const canvas = document.getElementById('sigCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(dpr, dpr);
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigCtx.strokeStyle = '#ece9f0';
  sigHasStrokes = false;
  clearSignature();
  attachSigEvents(canvas);
}

function closeSignModal() {
  document.getElementById('signModal').style.display = 'none';
}

function clearSignature() {
  const canvas = document.getElementById('sigCanvas');
  if (sigCtx) sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigHasStrokes = false;
  document.getElementById('sigHint').style.opacity = '1';
}

function getSigPoint(e, canvas) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return { x: src.clientX - rect.left, y: src.clientY - rect.top };
}

function attachSigEvents(canvas) {
  canvas.onpointerdown = (e) => {
    e.preventDefault();
    sigDrawing = true;
    canvas.setPointerCapture(e.pointerId);
    const p = getSigPoint(e, canvas);
    sigCtx.beginPath();
    sigCtx.moveTo(p.x, p.y);
    document.getElementById('sigHint').style.opacity = '0';
    sigHasStrokes = true;
  };
  canvas.onpointermove = (e) => {
    if (!sigDrawing) return;
    e.preventDefault();
    const p = getSigPoint(e, canvas);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    sigCtx.beginPath();
    sigCtx.moveTo(p.x, p.y);
  };
  canvas.onpointerup = canvas.onpointercancel = (e) => {
    sigDrawing = false;
    sigCtx.beginPath();
  };
}

async function submitSignature() {
  if (!sigHasStrokes) {
    document.getElementById('sigHint').style.opacity = '1';
    document.getElementById('sigHint').textContent = t('please_sign_first_err');
    document.getElementById('sigHint').style.color = '#ff7070';
    return;
  }
  const canvas = document.getElementById('sigCanvas');
  const blob = canvas.toDataURL('image/png');
  const btn = document.getElementById('sigSubmitBtn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await POST('/api/judge/'+me.id+'/dance/'+rdid+'/sign', { signature: blob });
    if (r && r.ok) {
      closeSignModal();
      rdid = null;
      pollActiveRound();
    } else {
      flash('შეცდომა');
      closeSignModal();
      loadDance();
    }
  } catch(err) {
    flash('კავშირის შეცდომა');
    closeSignModal();
  } finally {
    btn.disabled = false; btn.textContent = t('save_signature_btn');
  }
}

function el(t,c){const e=document.createElement(t);if(c)e.className=c;return e;}
function flash(msg){const f=document.getElementById('cs');const o=f.textContent;f.textContent=msg;setTimeout(()=>f.textContent=o,1200);}
function danceName(code){return ({W:'Waltz',T:'Tango',VW:'Viennese Waltz',F:'Foxtrot',Q:'Quickstep',
  SB:'Samba',CC:'Cha Cha',RU:'Rumba',PD:'Paso Doble',JI:'Jive'}[code])||code;}

let lastActivity = Date.now();
function resetActivityTimer() {
  lastActivity = Date.now();
}
window.addEventListener('pointerdown', resetActivityTimer);
window.addEventListener('keydown', resetActivityTimer);

setInterval(() => {
  if (me && (Date.now() - lastActivity > 30 * 60 * 1000)) {
    console.warn("Logging out due to 30 minutes of inactivity.");
    logout();
  }
}, 10000);

function logout() {
  if (jobsDoneTimeout) {
    clearTimeout(jobsDoneTimeout);
    jobsDoneTimeout = null;
  }
  localStorage.removeItem('telemark_judge_id');
  me = null;
  if (pollInterval) clearInterval(pollInterval);
  if (diagInterval) clearInterval(diagInterval);
  document.getElementById('headerBar').style.display = 'none';
  document.getElementById('footer').style.display = 'none';
  pickJudge();
}

async function boot() {
  connectWS();

  // URL PIN Auto-login Check
  const urlParams = new URLSearchParams(window.location.search);
  const pinParam = urlParams.get('pin');
  if (pinParam && /^\d{4}$/.test(pinParam)) {
    pickJudge();
    document.getElementById('pinInput').value = pinParam;
    submitPin();
    window.history.replaceState({}, document.title, window.location.pathname);
    return;
  }

  try {
    const comp = await api('/api/competition');
    document.getElementById('title').textContent = comp ? comp.name : 'Telemark';

    // Try to restore previously selected judge from localStorage
    const savedId = localStorage.getItem('telemark_judge_id');
    if (savedId) {
      const judges = await api('/api/judges');
      const found = judges.find(j => String(j.id) === String(savedId));
      if (found) {
        setJudge(found);
        return; // skip picker, go straight to judging
      }
      // Judge no longer exists (e.g. after re-pull) — clear and show picker
      localStorage.removeItem('telemark_judge_id');
    }
  } catch(e) {
    console.log("სერვერთან კავშირი ჯერ არ არის, PIN ეკრანი მაინც აქტიურია.");
  }
  pickJudge();
}

boot();

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('Service Worker registered', reg))
      .catch(err => console.error('Service Worker registration failed', err));
  });
}
