<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Telemark · criteria შეფასება</title>
<link rel="icon" type="image/png" href="/logo_telemark.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#09080d;--surface:rgba(19,17,26,.78);--surface2:rgba(28,25,38,.92);
  --ink:#ece9f0;--muted:#8d899a;--line:rgba(255,255,255,.08);
  --accent:#00e5ff;--ok:#3ec896;--ok-bg:rgba(62,200,150,.12);
  --warn:#ffd600;--danger:#ff5252;--num:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',-apple-system,sans-serif;font-size:15px;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(10,9,14,.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.logo{font-weight:800;font-size:20px;text-decoration:none;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sp{flex:1}
.navlink{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
.navlink:hover{color:var(--ink);border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:24px 20px}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;backdrop-filter:blur(10px)}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-family:inherit;font-size:14px;min-width:200px}
select:focus{outline:none;border-color:var(--accent)}
.tabs{display:flex;gap:8px;margin:6px 0 0}
.tab{padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.tab.active{background:var(--accent);color:#06222a;border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:56px;background:var(--bg)}
td.name{text-align:left}
.num{font-family:var(--num)}
.snum{font-family:var(--num);color:var(--accent);font-weight:700}
tr:hover td{background:rgba(255,255,255,.02)}
input.score{width:56px;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-family:var(--num);font-size:14px;text-align:center}
input.score:focus{outline:none;border-color:var(--accent)}
input.score.saved{border-color:var(--ok);background:var(--ok-bg)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.wrap{overflow-x:auto}
.place{font-family:var(--num);font-weight:800;font-size:16px;color:var(--accent)}
.total{font-family:var(--num);font-weight:800;font-size:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--ink);padding:12px 20px;border-radius:12px;font-weight:600;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hint{color:var(--muted);font-size:12px;margin-top:10px;line-height:1.5}
.pill{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-size:11px;font-weight:700}
</style>
</head>
<body>
<header>
  <a class="logo" href="/scrutineer.html">Telemark</a>
  <div class="sp"></div>
  <a class="navlink" href="/criteria.html">კრიტერიუმები</a>
  <a class="navlink" href="/scrutineer.html">მთავარი</a>
</header>

<main>
  <h1>criteria შეფასება</h1>
  <div class="sub">criteria-ზე დაფუძნებული კატეგორიების შეფასება — თითო მონაწილეს თითო კრიტერიუმზე ქულა. შედეგები ავტომატურად ითვლება.</div>

  <div class="card">
    <div class="controls">
      <div class="field">
        <label>კატეგორია (criteria)</label>
        <select id="catSel" onchange="onCatChange()"></select>
      </div>
      <div class="field" id="judgeField" style="display:none">
        <label>ვსჯი როგორც</label>
        <select id="judgeSel" onchange="renderGrid()"></select>
      </div>
      <div class="tabs">
        <button class="tab active" id="tabInput" onclick="switchTab('input')">შეყვანა</button>
        <button class="tab" id="tabResults" onclick="switchTab('results')">შედეგები</button>
      </div>
    </div>
    <div class="hint" id="topHint"></div>
  </div>

  <div class="card">
    <div id="panel"><div class="empty">აირჩიე criteria-ზე დაფუძნებული კატეგორია.</div></div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
const api = async (p, o = {}) => {
  const r = await fetch(p, o);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
};
const POST = (p, b) => api(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let toastT;
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

let critCats = [];   // criteria-based categories
let data = null;     // full scoring payload for current category
let tab = 'input';

async function boot() {
  try {
    const ov = await api('/api/scrutineer/overview');
    critCats = (ov.categories || []).filter(c => c.judging_system === 'criteria');
  } catch (e) { critCats = []; }
  const sel = document.getElementById('catSel');
  if (!critCats.length) {
    sel.innerHTML = '<option value="">— არცერთი criteria კატეგორია —</option>';
    document.getElementById('topHint').innerHTML = 'ჯერ არცერთი კატეგორია არ არის მონიშნული criteria-ზე. გახსენი <a class="navlink" href="/criteria.html" style="padding:2px 8px">კრიტერიუმები</a> და მონიშნე კატეგორია.';
    return;
  }
  sel.innerHTML = critCats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  onCatChange();
}

async function onCatChange() {
  const catId = +document.getElementById('catSel').value;
  if (!catId) return;
  try { data = await api('/api/criteria-scoring/' + catId); }
  catch (e) { document.getElementById('panel').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

  // judge selector
  const jf = document.getElementById('judgeField');
  const js = document.getElementById('judgeSel');
  if (data.judges.length) {
    jf.style.display = 'flex';
    js.innerHTML = data.judges.map(j => `<option value="${j.id}">${j.judge_letter ? j.judge_letter + ' · ' : ''}${esc(j.full_name)}</option>`).join('');
  } else {
    jf.style.display = 'none';
  }
  render();
}

function switchTab(t) {
  tab = t;
  document.getElementById('tabInput').classList.toggle('active', t === 'input');
  document.getElementById('tabResults').classList.toggle('active', t === 'results');
  render();
}

function render() { tab === 'input' ? renderGrid() : renderResults(); }

// key: score lookup by judge+entry+criterion
function scoreOf(oid, eid, cid) {
  const m = data.marks.find(x => x.official_id === oid && x.entry_id === eid && x.criterion_id === cid);
  return m ? m.score : '';
}

function renderGrid() {
  const panel = document.getElementById('panel');
  if (!data) return;
  if (!data.criteria.length) { panel.innerHTML = '<div class="empty">ჯერ კრიტერიუმები არ არის. დაამატე „კრიტერიუმები" გვერდზე.</div>'; return; }
  if (!data.entries.length) { panel.innerHTML = '<div class="empty">ამ კატეგორიაში მონაწილეები არ არის.</div>'; return; }
  const oid = +document.getElementById('judgeSel').value;

  document.getElementById('topHint').innerHTML = `${data.entries.length} მონაწილე · ${data.criteria.length} კრიტერიუმი · ცვლილება ავტომატურად ინახება <span class="pill">auto-save</span>`;

  let html = `<div class="wrap"><table><thead><tr>
    <th style="text-align:left">#</th><th style="text-align:left">მონაწილე</th>
    ${data.criteria.map(c => `<th title="${esc(c.name_en)}">${esc(c.name)}<br><span class="num" style="font-weight:400;color:var(--muted)">${c.range_min}-${c.range_max}</span></th>`).join('')}
    <th>ჯამი</th></tr></thead><tbody>`;

  for (const e of data.entries) {
    let rowTotal = 0;
    const cells = data.criteria.map(c => {
      const v = scoreOf(oid, e.id, c.id);
      if (v !== '' && v != null) rowTotal += +v;
      return `<td><input class="score" type="number" min="${c.range_min}" max="${c.range_max}"
        value="${v}" data-e="${e.id}" data-c="${c.id}"
        onchange="saveScore(this)"/></td>`;
    }).join('');
    html += `<tr>
      <td class="snum">${e.start_number ?? '—'}</td>
      <td class="name">${esc(e.name2 ? e.name1 + ' & ' + e.name2 : e.name1)}${e.studio_name ? `<br><span style="color:var(--muted);font-size:12px">${esc(e.studio_name)}</span>` : ''}</td>
      ${cells}
      <td class="total" data-tot="${e.id}">${rowTotal || ''}</td>
    </tr>`;
  }
  html += '</tbody></table></div>';
  panel.innerHTML = html;
}

async function saveScore(input) {
  const oid = +document.getElementById('judgeSel').value;
  const eid = +input.dataset.e, cid = +input.dataset.c;
  const score = input.value === '' ? '' : +input.value;
  try {
    const r = await POST(`/api/criteria-scoring/${+document.getElementById('catSel').value}/score`,
      { official_id: oid, entry_id: eid, criterion_id: cid, score });
    // update local cache
    data.marks = data.marks.filter(m => !(m.official_id === oid && m.entry_id === eid && m.criterion_id === cid));
    if (!r.cleared) { input.value = r.score; data.marks.push({ official_id: oid, entry_id: eid, criterion_id: cid, score: r.score }); }
    input.classList.add('saved'); setTimeout(() => input.classList.remove('saved'), 700);
    // recompute row total
    let tot = 0;
    document.querySelectorAll(`input.score[data-e="${eid}"]`).forEach(i => { if (i.value !== '') tot += +i.value; });
    const tc = document.querySelector(`[data-tot="${eid}"]`); if (tc) tc.textContent = tot || '';
  } catch (e) { toast('შეცდომა: ' + e.message); }
}

async function renderResults() {
  const panel = document.getElementById('panel');
  const catId = +document.getElementById('catSel').value;
  document.getElementById('topHint').textContent = 'შედეგები — ჯამი ყველა კრიტერიუმსა და ყველა მსაჯზე.';
  panel.innerHTML = '<div class="empty">იტვირთება…</div>';
  let r;
  try { r = await api('/api/criteria-scoring/' + catId + '/results'); }
  catch (e) { panel.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const rows = r.results || [];
  if (!rows.length || rows.every(x => x.total === 0)) { panel.innerHTML = '<div class="empty">ჯერ ქულები არ არის შეყვანილი.</div>'; return; }

  panel.innerHTML = `<div class="wrap"><table><thead><tr>
    <th>ადგილი</th><th style="text-align:left">#</th><th style="text-align:left">მონაწილე</th>
    <th>ჯამი</th><th>საშუალო</th><th>მსაჯების რაოდ.</th></tr></thead><tbody>
    ${rows.map(x => `<tr>
      <td class="place">${x.total ? x.place : '—'}</td>
      <td class="snum" style="text-align:left">${x.start_number ?? '—'}</td>
      <td class="name">${esc(x.name)}${x.studio_name ? `<br><span style="color:var(--muted);font-size:12px">${esc(x.studio_name)}</span>` : ''}</td>
      <td class="total">${x.total || '—'}</td>
      <td class="num">${x.average || '—'}</td>
      <td class="num">${x.judges_scored}</td>
    </tr>`).join('')}
  </tbody></table></div>`;
}

// live refresh when other devices submit scores
function connectWS() {
  try {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}`);
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m && m.type === 'criteria:score' && tab === 'results') renderResults();
      } catch (_) {}
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
  } catch (_) {}
}

boot();
connectWS();
</script>
</body>
</html>
